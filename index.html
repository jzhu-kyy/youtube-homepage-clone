<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A polished YouTube homepage and watch experience built for the ProductSC developer challenge."
    />
    <title>YouTube Clone</title>
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="light">
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="topbar__start">
          <button class="icon-button" id="menuButton" aria-label="Toggle navigation">
            <span class="icon" data-icon="menu"></span>
          </button>
          <button class="brand" id="brandButton" aria-label="YouTube home">
            <span class="brand__mark"><span class="brand__play"></span></span>
            <span class="brand__word">YouTube</span>
            <span class="brand__region">US</span>
          </button>
        </div>

        <form class="search" id="searchForm" role="search">
          <label class="search__field">
            <span class="sr-only">Search</span>
            <input id="searchInput" type="search" placeholder="Search or ask a question" autocomplete="off" />
            <button class="search__ask" id="askButton" type="button"><span>✦</span> Ask YouTube</button>
          </label>
          <button class="search__submit" type="submit" aria-label="Search">
            <span class="icon" data-icon="search"></span>
          </button>
          <button class="icon-button icon-button--filled search__mic" type="button" id="voiceButton" aria-label="Search with your voice">
            <span class="icon" data-icon="mic"></span>
          </button>
        </form>

        <div class="topbar__end">
          <button class="create-button" id="createButton" type="button">
            <span class="icon" data-icon="plus"></span>
            <span>Create</span>
          </button>
          <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="Notifications">
            <span class="icon" data-icon="bell"></span>
            <span class="notification-button__dot"></span>
          </button>
          <button class="sign-in-button" id="profileButton" type="button" aria-label="Sign in">Sign in</button>
        </div>
      </header>

      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <nav class="sidebar__nav" id="sidebarNav"></nav>
        <p class="sidebar__footer">About · Press · Copyright<br />Contact · Creators · Advertise<br />Terms · Privacy · Safety</p>
        <p class="sidebar__copyright">Clone demo · 2026</p>
      </aside>

      <main class="main" id="mainContent" tabindex="-1"></main>
    </div>

    <div class="menu-popover" id="profileMenu" hidden>
      <div class="profile-card">
        <span class="avatar avatar--profile" id="profileMenuAvatar">J</span>
        <div><strong id="profileMenuName">Guest</strong><span id="profileMenuEmail">Not signed in</span></div>
      </div>
      <button data-action="theme"><span class="icon" data-icon="moon"></span>Appearance</button>
      <button data-action="settings"><span class="icon" data-icon="settings"></span>Settings</button>
      <button data-action="feedback"><span class="icon" data-icon="help"></span>Send feedback</button>
      <button data-action="logout" id="logoutButton"><span class="icon" data-icon="history"></span>Sign out</button>
    </div>

    <div class="auth-backdrop" id="authModal" hidden>
      <section class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <button class="icon-button auth-modal__close" id="authClose" type="button" aria-label="Close"><span aria-hidden="true">×</span></button>
        <span class="brand auth-modal__brand"><span class="brand__mark"><span class="brand__play"></span></span><span class="brand__word">YouTube</span></span>
        <h2 id="authTitle">Sign in</h2>
        <p id="authSubtitle">Continue to your saved videos and watch history.</p>
        <div class="auth-tabs" role="tablist">
          <button class="is-active" type="button" data-auth-tab="login" role="tab">Sign in</button>
          <button type="button" data-auth-tab="signup" role="tab">Create account</button>
        </div>
        <form id="authForm" novalidate>
          <label class="auth-field" id="nameField" hidden><span>Name</span><input id="authName" name="name" autocomplete="name" /></label>
          <label class="auth-field"><span>Email</span><input id="authEmail" name="email" type="email" autocomplete="email" required /></label>
          <label class="auth-field"><span>Password</span><input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
          <p class="form-message" id="authMessage" role="alert"></p>
          <button class="auth-submit" id="authSubmit" type="submit"><span class="button-label">Sign in</span><span class="button-spinner" hidden></span></button>
        </form>
        <p class="auth-modal__note">Your account, favorites, and history are stored securely by the demo backend.</p>
      </section>
    </div>

    <div class="network-banner" id="networkBanner" role="status" hidden></div>
    <div class="page-loader" id="pageLoader" aria-label="Loading" hidden><span></span><span></span><span></span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
